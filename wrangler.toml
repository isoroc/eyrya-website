# Cloudflare Pages Functions configuration.
#
# Only the three public form endpoints exist (functions/api/contact.js,
# wholesale.js, support.js). They talk to the Resend HTTP API and need no
# bindings, so there is deliberately no [[d1_databases]] or [[r2_buckets]] block
# here. The storefront is fully static and reads from lib/, not from a database.

name = "eyrya-website"
compatibility_date = "2024-03-01"
